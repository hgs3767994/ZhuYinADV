<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小小注音冒險家</title>
  <style>
    /* ---------------- 全域基本設定 ---------------- */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* ---------------- 畫面切換框架 ---------------- */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .screen.active {
      display: flex;
    }

    /* 暗色遮罩（提升介面文字可讀性） */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.45);
      z-index: 1;
    }
    .content-layer {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }

    /* ---------------- 🎬 畫面 1：歡迎頁動畫與排版 ---------------- */
    #screen-1 {
      background-image: url('./pics/start_banner.png');
    }
    .screen-1-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 3vh 20px 2vh 20px;
    }

    /* 🎈 標題：向上懸停飄浮動畫 */
    .title-img {
      max-width: 90%;
      max-height: 35vh;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5));
      animation: bounceIn 1s cubic-bezier(0.215, 0.610, 0.355, 1.000) both, floatHigh 3s ease-in-out infinite 1s;
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale3d(0.3, 0.3, 0.3) translate3d(0, -300px, 0); }
      60% { opacity: 1; transform: scale3d(1.1, 1.1, 1.1) translate3d(0, 25px, 0); }
      75% { transform: scale3d(0.95, 0.95, 0.95) translate3d(0, -10px, 0); }
      90% { transform: scale3d(1.02, 1.02, 1.02) translate3d(0, 5px, 0); }
      100% { transform: scale3d(1, 1, 1) translate3d(0, 0, 0); }
    }

    @keyframes floatHigh {
      0%, 100% { transform: translateY(-12px); }
      50% { transform: translateY(-28px); }
    }

    /* 🔘 「開始冒險」按鈕 */
    .start-btn-container {
      margin-top: auto;
      margin-bottom: -100px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .start-btn-img {
      max-width: 420px;
      width: 90vw;
      height: auto;
      cursor: pointer;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.6));
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .start-btn-img:hover { transform: scale(1.05); }
    .start-btn-img:active { transform: scale(0.92) translateY(4px); }

    /* ---------------- 🎯 畫面 2 & 2-2：選單與難度 ---------------- */
    .menu-card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(8px);
      border: 2px solid #334155;
      border-radius: 24px;
      padding: 30px 20px;
      width: 90%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h2 { font-size: 1.8rem; color: #facc15; text-shadow: 0 2px 8px rgba(0,0,0,0.5); margin-bottom: 5px; }

    .menu-btn {
      width: 100%;
      padding: 16px 20px;
      font-size: 1.25rem;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(29,78,216,0.4);
      transition: transform 0.15s, filter 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .menu-btn .sub-text { font-size: 0.85rem; font-weight: normal; opacity: 0.85; margin-top: 3px; }
    .menu-btn:active { transform: scale(0.95); }

    .back-btn {
      background: transparent;
      color: #cbd5e1;
      border: 1px solid #64748b;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    /* ---------------- ⚔️ 畫面 3：遊戲挑戰區域 ---------------- */
    #screen-3-bg {
      transition: background-image 0.4s ease-in-out;
    }

    #game-info-bar {
      width: 100%;
      max-width: 520px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 1.1rem;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .info-center-lives {
      flex: 1;
      text-align: center;
      font-size: 1.6rem;
      letter-spacing: 2px;
    }

    /* ⏱️ 倒數計時器 UI 樣式 */
    #timer-container {
      width: 100%;
      max-width: 520px;
      margin-top: 10px;
      display: none; /* 僅無限模式顯示 */
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .timer-text {
      font-size: 1.2rem;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      transition: color 0.3s;
    }
    .timer-text.warning {
      color: #ef4444;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      animation: pulseText 0.5s infinite alternate;
    }
    .timer-bar-outer {
      width: 100%;
      height: 14px;
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid #475569;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    .timer-bar-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #3b82f6);
      border-radius: 8px;
      transition: width 0.1s linear, background 0.3s;
    }
    .timer-bar-inner.warning {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
    }

    @keyframes pulseText {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    #combo-display-area {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
    }
    .combo-badge {
      font-size: 1.35rem;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.9), 0 2px 4px rgba(0,0,0,0.9);
      animation: comboPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes comboPop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .audio-play-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #facc15, #eab308);
      border: 4px solid #ffffff;
      font-size: 2.5rem;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(234, 179, 8, 0.5);
      margin: 10px 0 5px 0;
      transition: transform 0.15s;
    }
    .audio-play-btn:active { transform: scale(0.88); }

    .options-grid {
      display: grid;
      gap: 12px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 10px;
    }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-6 { grid-template-columns: repeat(3, 1fr); }

    /* ✨ 注音卡片發光與點擊回饋特效 */
    .symbol-card {
      background: rgba(30, 41, 59, 0.9);
      border: 3px solid #475569;
      border-radius: 18px;
      font-size: 2.3rem;
      font-weight: bold;
      color: #ffffff;
      padding: 18px 0;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      transition: all 0.3s ease-out;
    }

    /* ✨ 選對：金色/青色炫光 */
    .symbol-card.glowing {
      transform: scale(1.08);
      border-color: #facc15 !important;
      box-shadow: 0 0 30px #facc15, 0 0 15px #38bdf8 !important;
      background: rgba(51, 65, 85, 0.98) !important;
      z-index: 10;
    }

    /* 🚨 選錯：紅色警告發光 */
    .symbol-card.glowing-wrong {
      transform: scale(1.08);
      border-color: #ef4444 !important;
      box-shadow: 0 0 30px #ef4444, 0 0 15px #f87171 !important;
      background: rgba(127, 29, 29, 0.95) !important;
      z-index: 10;
    }

    .symbol-card.disabled { opacity: 0.25; pointer-events: none; border-color: #1e293b; filter: grayscale(100%); box-shadow: none; }

    /* ---------------- ⏳ 載入緩衝黑屏 Modal ---------------- */
    #loading-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000000;
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #loading-overlay.active { display: flex; }
    .loading-text {
      font-size: 1.8rem;
      font-weight: bold;
      color: #facc15;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.6);
      animation: loadingPulse 1s ease-in-out infinite alternate;
    }
    @keyframes loadingPulse {
      0% { transform: scale(0.92); opacity: 0.6; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    /* ---------------- 📊 彈窗 Modal ---------------- */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      align-items: center; justify-content: center;
      z-index: 100;
      backdrop-filter: blur(5px);
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #1e293b;
      border-radius: 24px;
      padding: 25px;
      width: 88%; max-width: 420px;
      text-align: center;
      border: 2px solid #475569;
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    }

    /* 🏷️ 首頁右下角版本號 */
    .version-tag {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 0.9rem;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.6); /* 半透明白色 */
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      pointer-events: none; /* 避免擋到點擊事件 */
    }
  </style>
</head>
<body onclick="initAudioOnFirstTouch()">

  <!-- ⏳ 載入緩衝黑屏 -->
  <div id="loading-overlay">
    <div class="loading-text">🎒 冒險準備中...</div>
  </div>

  <!-- 🏠 畫面 1：遊戲歡迎頁（首頁） -->
  <div id="screen-1" class="screen active">
    <div class="screen-1-container">
      <img src="./pics/title.png" alt="小小注音冒險家" class="title-img" onerror="this.style.display='none'">
      <div class="start-btn-container">
        <img src="./pics/start_button.png" alt="開始冒險" class="start-btn-img" onclick="handleStartBtnClick()">
      </div>

       <!-- 💡 新增這行：右下角版本號 -->
      <div class="version-tag">v 1.0b</div>
    </div>
  </div>

  <!-- 🎮 畫面 2：模式選擇畫面 -->
  <div id="screen-2" class="screen" style="background-image: url('./pics/start_banner.png');">
    <div class="overlay"></div>
    <div class="content-layer" style="justify-content: center;">
      <div class="menu-card">
        <h2>選擇冒險模式</h2>
        <button class="menu-btn" onclick="playClickAndGo('screen-2-2')">
          🧭 一般模式
        </button>
        <button class="menu-btn" style="background: linear-gradient(135deg, #059669, #047857);" onclick="playClickAndStartEndless()">
          ⚔️ 無限模式
        </button>
        <button class="menu-btn" style="background: linear-gradient(135deg, #8b5cf6, #6d28d9);" onclick="playClickAndShowBoard()">
          🏆 冒險紀錄 (前 5 名)
        </button>
        <button class="back-btn" onclick="playClickAndGo('screen-1')">↩️ 返回首頁</button>
      </div>
    </div>
  </div>

  <!-- 🗺️ 畫面 2-2：難度選擇畫面 -->
  <div id="screen-2-2" class="screen" style="background-image: url('./pics/start_banner.png');">
    <div class="overlay"></div>
    <div class="content-layer" style="justify-content: center;">
      <div class="menu-card">
        <h2>🌟 選擇探險路線 🌟</h2>
        <button class="menu-btn" style="background: linear-gradient(135deg, #10b981, #059669);" onclick="playClickAndStartNormal('easy')">
          🌱 草原探險
          <span class="sub-text">菜鳥</span>
        </button>
        <button class="menu-btn" style="background: linear-gradient(135deg, #f59e0b, #d97706);" onclick="playClickAndStartNormal('normal')">
          🌲 叢林冒險
          <span class="sub-text">冒險者</span>
        </button>
        <button class="menu-btn" style="background: linear-gradient(135deg, #ef4444, #dc2626);" onclick="playClickAndStartNormal('hard')">
          🏜️ 荒地探勘
          <span class="sub-text">開路先鋒</span>
        </button>
        <button class="back-btn" onclick="playClickAndGo('screen-2')">↩️ 返回模式選擇</button>
      </div>
    </div>
  </div>

  <!-- ⚔️ 畫面 3：遊戲挑戰畫面 -->
  <div id="screen-3" class="screen">
    <div class="overlay"></div>
    <div class="content-layer">
      <!-- 頂部資訊列 -->
      <div id="game-info-bar">
        <span id="info-progress">題目：1/20</span>
        <span id="info-lives" class="info-center-lives"></span>
        <span id="info-score" style="color: #38bdf8;">得分：0</span>
      </div>

      <!-- ⏱️ 倒數計時條 UI -->
      <div id="timer-container">
        <div class="timer-text" id="timer-text">⏳ 5.0 秒</div>
        <div class="timer-bar-outer">
          <div class="timer-bar-inner" id="timer-bar-inner"></div>
        </div>
      </div>

      <!-- 🔥 獨立 Combo 顯示區塊 -->
      <div id="combo-display-area"></div>

      <!-- 發音喇叭 -->
      <div style="display:flex; flex-direction:column; align-items:center;">
        <button class="audio-play-btn" onclick="replayAudio()">🔊</button>
        <p style="color: #e2e8f0; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">點擊重複聽發音</p>
      </div>

      <!-- 注音選項卡片區 -->
      <div id="options-container" class="options-grid"></div>

      <!-- 放棄按鈕 -->
      <button class="back-btn" style="margin-bottom: 10px;" onclick="confirmQuit()">🚪 放棄冒險</button>
    </div>
  </div>

  <!-- 📊 第一階段：本次結算 Modal -->
  <div id="modal-result" class="modal">
    <div class="modal-content">
      <h2 id="result-title">🎉 冒險完成 🎉</h2>
      <div id="result-stars" style="font-size: 2.2rem; margin: 15px 0;"></div>
      <p id="result-desc" style="font-size: 1.1rem; line-height: 1.6; color: #cbd5e1;"></p>
      <button class="menu-btn" style="margin-top: 20px;" onclick="playDing(); closeModal('modal-result'); showLeaderboard();">🏆 查看冒險紀錄</button>
    </div>
  </div>

  <!-- 🏆 第二階段：冒險紀錄排行榜 Modal -->
  <div id="modal-leaderboard" class="modal">
    <div class="modal-content">
      <h2 style="font-size: 1.5rem; color: #facc15;">🏆 冒險紀錄殿堂 🏆</h2>
      <div style="text-align: left; margin: 15px 0; font-size: 0.95rem; line-height: 1.8;">
        <h4 style="color: #38bdf8; border-bottom: 1px solid #475569; padding-bottom: 4px; margin-bottom: 8px;">🎯 一般模式 (最高分 1000)</h4>
        <div id="list-normal" style="color: #cbd5e1; margin-bottom: 15px;"></div>
        <h4 style="color: #34d399; border-bottom: 1px solid #475569; padding-bottom: 4px; margin-bottom: 8px;">♾️ 無限模式</h4>
        <div id="list-endless" style="color: #cbd5e1;"></div>
      </div>
      <button class="menu-btn" onclick="playDing(); closeModal('modal-leaderboard'); goToScreen('screen-2');">回選單</button>
    </div>
  </div>

  <!-- 引入 Base64 音效檔 -->
  <script src="sounds.js"></script>

  <script>
    const ZHUYIN_LIST = [
      'ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ','ㄎ','ㄏ',
      'ㄐ','ㄑ','ㄒ','ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ',
      'ㄚ','ㄛ','ㄜ','ㄝ','ㄞ','ㄟ','ㄠ','ㄡ','ㄢ','ㄣ','ㄤ','ㄥ','ㄦ',
      'ㄧ','ㄨ','ㄩ'
    ];

    let state = {
      mode: 'normal',
      diff: 'easy',
      score: 0,
      questionCount: 0,
      lives: 3,
      combo: 0,
      currentAnswer: '',
      attempts: 0,
      isLocking: false // 防止連續點擊鎖
    };

    // ⏱️ 計時器控制變數
    let timerInterval = null;
    let timerMaxDuration = 5000; // 當前題目的總時間 (ms)
    let timerRemainingTime = 5000; // 剩餘時間 (ms)

    let bgmAudio = null;
    let isAudioInitialized = false;

    function initAudioOnFirstTouch() {
      if (!isAudioInitialized && typeof BGM !== 'undefined') {
        bgmAudio = new Audio(BGM);
        bgmAudio.loop = true;
        bgmAudio.volume = 0.4;
        bgmAudio.play().catch(e => console.log('BGM Autoplay blocked'));
        isAudioInitialized = true;
      }
    }


// 🎧 監聽頁面可見性變化（切換頁面/縮小視窗時自動暫停與接續播放）
document.addEventListener('visibilitychange', () => {
  // 只有在 Audio 已初始化（玩家點擊過畫面）的前提下才執行
  if (!isAudioInitialized || !bgmAudio) return;

  if (document.hidden) {
    // 🚪 頁面被隱藏（切到桌面、切換分頁、手機螢幕鎖定）
    bgmAudio.pause();
  } else {
    // 🏠 頁面重新回到畫面上
    // 注意：如果玩家目前正處於「遊戲挑戰中(screen-3)」，依原本規則是不放 BGM 的
    const currentScreen = document.querySelector('.screen.active');
    if (currentScreen && currentScreen.id !== 'screen-3') {
      bgmAudio.play().catch(e => console.log('BGM resume blocked:', e));
    }
  }
});




    function playBgm() {
      if (bgmAudio) bgmAudio.play().catch(e => console.log(e));
    }

    function stopBgm() {
      if (bgmAudio) bgmAudio.pause();
    }

    function playDing() {
      if (typeof DING_SOUND !== 'undefined') {
        const a = new Audio(DING_SOUND);
        a.volume = 0.3;
        a.play().catch(e => console.log(e));
      }
    }

    function speak(symbol) {
      if (typeof ZHUYIN_AUDIO_MAP !== 'undefined' && ZHUYIN_AUDIO_MAP[symbol]) {
        const audio = new Audio(ZHUYIN_AUDIO_MAP[symbol]);
        audio.currentTime = 0; audio.volume = 1.0;
        audio.play().catch(e => console.log(e));
      }
    }

    function playSfx(type) {
      if (type === 'correct' && typeof SOUND_SUCCESS_BASE64 !== 'undefined') {
        const a = new Audio(SOUND_SUCCESS_BASE64); a.volume = 0.4; a.play();
      } else if (type === 'wrong' && typeof SOUND_WRONG_BASE64 !== 'undefined') {
        const a = new Audio(SOUND_WRONG_BASE64); a.volume = 0.7; a.play();
      }
    }

    function goToScreen(screenId) {
      stopTimer(); // 切換畫面時停止計時器
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      if (screenId === 'screen-3') {
        stopBgm();
      } else {
        playBgm();
      }
    }

    function handleStartBtnClick() {
      playDing();
      goToScreen('screen-2');
    }

    function playClickAndGo(screenId) {
      playDing();
      goToScreen(screenId);
    }

    function playClickAndShowBoard() {
      playDing();
      showLeaderboard();
    }

    function playClickAndStartNormal(diff) {
      playDing();
      showLoadingAndStart(() => {
        state.mode = 'normal';
        state.diff = diff;
        state.score = 0;
        state.questionCount = 1;
        
        const screen3 = document.getElementById('screen-3');
        if (diff === 'easy') screen3.style.backgroundImage = "url('./pics/bg_prairie.png')";
        else if (diff === 'normal') screen3.style.backgroundImage = "url('./pics/bg_jungle.png')";
        else if (diff === 'hard') screen3.style.backgroundImage = "url('./pics/bg_wasteland.png')";

        document.getElementById('timer-container').style.display = 'none'; // 一般模式隱藏計時條
        goToScreen('screen-3');
        nextQuestion();
      });
    }

    function playClickAndStartEndless() {
      playDing();
      showLoadingAndStart(() => {
        state.mode = 'endless';
        state.score = 0;
        state.questionCount = 1;
        state.lives = 3;
        state.combo = 0;
        
        document.getElementById('screen-3').style.backgroundImage = "url('./pics/bg_endless.png')";
        document.getElementById('timer-container').style.display = 'flex'; // 無限模式顯示計時條
        goToScreen('screen-3');
        nextQuestion();
      });
    }

    function showLoadingAndStart(callback) {
      const loader = document.getElementById('loading-overlay');
      loader.classList.add('active');
      setTimeout(() => {
        callback();
        loader.classList.remove('active');
      }, 3000);
    }

    // ⏱️ 計時器邏輯（無限模式時間階梯修正）
function startTimer() {
  stopTimer();
  if (state.mode !== 'endless') return;

  const timerContainer = document.getElementById('timer-container');

  // 無限模式時間階梯判斷：1-50 題無時間限制
  if (state.questionCount <= 50) {
    if (timerContainer) timerContainer.style.display = 'none';
    return; // 不啟動計時器
  } else if (state.questionCount <= 60) {
    timerMaxDuration = 5000;   // 51-60 題：5 秒
  } else if (state.questionCount <= 70) {
    timerMaxDuration = 3000;   // 61-70 題：3 秒
  } else if (state.questionCount <= 80) {
    timerMaxDuration = 1500;   // 71-80 題：1.5 秒
  } else {
    timerMaxDuration = 1000;   // 81 題以上：1 秒
  }

  // 超過 50 題時顯示倒數計時 UI 並開始倒數
  if (timerContainer) timerContainer.style.display = 'flex';

  timerRemainingTime = timerMaxDuration;
  updateTimerUI();

  const step = 100; // 每 100ms 刷新一次 UI
  timerInterval = setInterval(() => {
    timerRemainingTime -= step;
    if (timerRemainingTime <= 0) {
      timerRemainingTime = 0;
      updateTimerUI();
      handleTimeout();
    } else {
      updateTimerUI();
    }
  }, step);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

    function updateTimerUI() {
      const timerText = document.getElementById('timer-text');
      const timerBar = document.getElementById('timer-bar-inner');
      
      const secondsSec = (timerRemainingTime / 1000).toFixed(1);
      timerText.innerText = `⏳ ${secondsSec} 秒`;

      const pct = (timerRemainingTime / timerMaxDuration) * 100;
      timerBar.style.width = `${pct}%`;

      // 剩餘時間小於等於 1.5 秒或 30% 時觸發紅光警示
      if (timerRemainingTime <= 1500 || pct <= 30) {
        timerText.classList.add('warning');
        timerBar.classList.add('warning');
      } else {
        timerText.classList.remove('warning');
        timerBar.classList.remove('warning');
      }
    }

    // 超時懲罰邏輯
    function handleTimeout() {
      stopTimer();
      playSfx('wrong');
      
      state.lives--;
      state.combo = 0;
      updateUI();

      if (state.lives <= 0) {
        state.isLocking = true;
        setTimeout(() => endGame(), 650);
      } else {
        // 超時後直接進入下一題
        state.questionCount++;
        nextQuestion();
      }
    }

    function nextQuestion() {
      state.attempts = 0;
      state.isLocking = false; // 解除點擊鎖
      updateUI();

      state.currentAnswer = ZHUYIN_LIST[Math.floor(Math.random() * ZHUYIN_LIST.length)];

      let optionCount = 2;
      if (state.mode === 'normal') {
        optionCount = state.diff === 'easy' ? 2 : (state.diff === 'normal' ? 4 : 6);
      } else {
        if (state.questionCount <= 10) optionCount = 2;
        else if (state.questionCount <= 20) optionCount = 3;
        else if (state.questionCount <= 30) optionCount = 4;
        else optionCount = 6;
      }

      let options = [state.currentAnswer];
      while (options.length < optionCount) {
        let pick = ZHUYIN_LIST[Math.floor(Math.random() * ZHUYIN_LIST.length)];
        if (!options.includes(pick)) options.push(pick);
      }
      options.sort(() => Math.random() - 0.5);

      const container = document.getElementById('options-container');
      container.className = `options-grid grid-${optionCount}`;
      container.innerHTML = '';

      options.forEach(symbol => {
        const btn = document.createElement('div');
        btn.className = 'symbol-card';
        btn.innerText = symbol;
        btn.onclick = () => handleAnswer(symbol, btn);
        container.appendChild(btn);
      });

      setTimeout(() => speak(state.currentAnswer), 250);

      // 開始當前題目倒數
      startTimer();
    }

    function replayAudio() {
      speak(state.currentAnswer);
    }

    // ✨ 答題邏輯（正確金/青光，錯誤紅光）
    function handleAnswer(selectedSymbol, btnElem) {
      if (state.isLocking) return; // 鎖定狀態下防止重複點擊

      if (selectedSymbol === state.currentAnswer) {
        // ----------------- 🎯 答對情況 -----------------
        state.isLocking = true;
        stopTimer(); // 答對立即凍結倒數時間條
        btnElem.classList.add('glowing'); // 觸發金色/青色發光
        playSfx('correct');

        if (state.mode === 'normal') {
          let earned = Math.max(0, 50 - (state.attempts * 10));
          state.score += earned;

          setTimeout(() => {
            btnElem.classList.remove('glowing');
            if (state.questionCount >= 20) {
              endGame();
            } else {
              state.questionCount++;
              nextQuestion();
            }
          }, 650);

        } else {
          state.combo++;
          let addScore = (state.combo >= 3) ? (50 + (state.combo * 10)) : 50;
          state.score += addScore;
          state.questionCount++;

          setTimeout(() => {
            btnElem.classList.remove('glowing');
            nextQuestion();
          }, 650);
        }

      } else {
        // ----------------- ❌ 答錯情況 -----------------
        // 選錯時不暫停倒數計時，時間繼續流逝！
        btnElem.classList.add('glowing-wrong'); // 觸發紅色發光
        playSfx('wrong');

        // 紅光維持 350ms 後，移除紅光並變灰停用
        setTimeout(() => {
          btnElem.classList.remove('glowing-wrong');
          btnElem.classList.add('disabled');
        }, 350);

        if (state.mode === 'normal') {
          state.attempts++;
        } else {
          state.lives--;
          state.combo = 0;
          updateUI();
          if (state.lives <= 0) {
            state.isLocking = true;
            stopTimer(); // 扣光生命時才停止計時
            setTimeout(() => endGame(), 650);
          }
        }
      }
    }

    function updateUI() {
      document.getElementById('info-score').innerText = `得分：${state.score}`;
      
      const livesElem = document.getElementById('info-lives');
      const comboArea = document.getElementById('combo-display-area');

      if (state.mode === 'normal') {
        document.getElementById('info-progress').innerText = `題目：${state.questionCount}/20`;
        livesElem.innerText = '';
        comboArea.innerHTML = '';
      } else {
        document.getElementById('info-progress').innerText = `第 ${state.questionCount} 題`;
        livesElem.innerText = '❤️'.repeat(state.lives);

        if (state.combo >= 3) {
          comboArea.innerHTML = `<div class="combo-badge">🔥 Combo x${state.combo}！</div>`;
        } else {
          comboArea.innerHTML = '';
        }
      }
    }

    function endGame() {
      stopTimer(); // 結束遊戲時徹底停止計時器
      saveScore(state.mode, state.score);

      const title = document.getElementById('result-title');
      const stars = document.getElementById('result-stars');
      const desc = document.getElementById('result-desc');

      if (state.mode === 'normal') {
        title.innerText = '🎉 冒險完成 🎉';
        let starStr = '⭐️';
        if (state.score === 1000) starStr = '👑 ⭐️⭐️⭐️⭐️⭐️';
        else if (state.score >= 900) starStr = '⭐️⭐️⭐️';
        else if (state.score >= 700) starStr = '⭐️⭐️';

        stars.innerText = starStr;
        desc.innerText = `最終得分：${state.score} 分\n成功突破 20 題考驗！`;
      } else {
        title.innerText = '💥 冒險結束！';
        stars.innerText = '🏆';
        desc.innerText = `最終得分：${state.score} 分\n總共答對前進了 ${state.questionCount - 1} 題！`;
      }

      document.getElementById('modal-result').classList.add('active');
    }

    function saveScore(mode, score) {
      const key = `zhuyin_ranks_${mode}`;
      let ranks = JSON.parse(localStorage.getItem(key) || '[]');
      ranks.push({ score, date: new Date().toLocaleDateString() });
      ranks.sort((a, b) => b.score - a.score);
      ranks = ranks.slice(0, 5);
      localStorage.setItem(key, JSON.stringify(ranks));
    }

    function showLeaderboard() {
      const normalRanks = JSON.parse(localStorage.getItem('zhuyin_ranks_normal') || '[]');
      const endlessRanks = JSON.parse(localStorage.getItem('zhuyin_ranks_endless') || '[]');

      const renderList = (ranks) => ranks.length === 0 
        ? '<p style="color:#64748b">尚無冒險紀錄</p>' 
        : ranks.map((r, i) => `<div>第 ${i+1} 名：<b style="color:#facc15">${r.score}</b> 分 <span style="font-size:0.8rem; color:#64748b;">(${r.date})</span></div>`).join('');

      document.getElementById('list-normal').innerHTML = renderList(normalRanks);
      document.getElementById('list-endless').innerHTML = renderList(endlessRanks);
      document.getElementById('modal-leaderboard').classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function confirmQuit() {
      playDing();
      if (confirm('確定要放棄這次的冒險返回選單嗎？')) {
        goToScreen('screen-2');
      }
    }
  </script>

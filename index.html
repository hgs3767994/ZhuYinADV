<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小小注音冒險家</title>
  <!-- 📱 PWA 設定與 iOS 支援 -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="小小注音冒險家">
  <link rel="apple-touch-icon" href="./pics/icon-192.png">
  <style>
    /* ---------------- 全域基本設定 ---------------- */

    /* 🚀 精準 GPU 硬體加速：省電、降溫、順暢不掉幀 */
       button, 
       .animated-element, 
       .card-glow, 
       .btn-hover {
          -webkit-backface-visibility: hidden;
          backface-visibility: hidden;
          transform: translateZ(0);
          will-change: transform, opacity;
       }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a;
      color: #ffffff;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* ---------------- 畫面切換框架 ---------------- */
    .screen {
      display: none;
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    .screen.active {
      display: flex;
    }

    /* 暗色遮罩（提升介面文字可讀性） */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.45);
      z-index: 1;
    }

.content-layer {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center; /* 👈 改為 center，讓按鈕群在畫面垂直居中 */
  padding: 20px;
}

    /* ---------------- 🎬 畫面 1：歡迎頁動畫與排版 ---------------- */
    #screen-1 {
      background-image: url('./pics/start_banner.png');
    }
    .screen-1-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 3vh 20px 2vh 20px;
    }

    /* 🎈 標題：向上懸停飄浮動畫 */
    .title-img {
      max-width: 90%;
      max-height: 35vh;
      object-fit: contain;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5));
      animation: bounceIn 1s cubic-bezier(0.215, 0.610, 0.355, 1.000) both, floatHigh 3s ease-in-out infinite 1s;
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale3d(0.3, 0.3, 0.3) translate3d(0, -300px, 0); }
      60% { opacity: 1; transform: scale3d(1.1, 1.1, 1.1) translate3d(0, 25px, 0); }
      75% { transform: scale3d(0.95, 0.95, 0.95) translate3d(0, -10px, 0); }
      90% { transform: scale3d(1.02, 1.02, 1.02) translate3d(0, 5px, 0); }
      100% { transform: scale3d(1, 1, 1) translate3d(0, 0, 0); }
    }

    @keyframes floatHigh {
      0%, 100% { transform: translateY(-12px); }
      50% { transform: translateY(-28px); }
    }

    /* 🔘 「開始冒險」按鈕 */
    .start-btn-container {
      margin-top: 0;
      margin-bottom: 30px;
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .start-btn-img {
      max-width: 230px;
      width: 60vw;
      height: auto;
      cursor: pointer;
      filter: drop-shadow(0 8px 20px rgba(0, 0, 0, 0.6));
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .start-btn-img:hover { transform: scale(1.05); }
    .start-btn-img:active { transform: scale(0.92) translateY(4px); }

    /* ---------------- 🎯 畫面 2 & 2-2：選單與難度 ---------------- */
/* 簡化後的容器：拿掉深色卡片背景，純粹用來排版圖片按鈕 */
.menu-card {
  width: 100%;
  max-width: 300px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px; /* 按鈕之間的上下間距 */
}

/* 🔘 全新：圖片按鈕專用樣式 */
.img-menu-btn {
  background: none !important;
  border: none !important;
  padding: 0;
  margin: 0;
  cursor: pointer;
  outline: none;
  width: 100%;
  display: flex;
  justify-content: center;
}

/* 🔘 全新：圖片本體點擊感與陰影 */
.menu-btn-img {
  width: 100%;
  max-width: 340px; /* 控制按鈕在手機上的最佳寬度 */
  height: auto;
  display: block;
  filter: drop-shadow(0 6px 16px rgba(0, 0, 0, 0.5));
  transition: transform 0.1s ease-out;
}

/* 🔘 全新：透過 JS 強制觸發的點擊下壓狀態 */
.menu-btn-img.pressed {
  transform: scale(0.92) translateY(4px) !important;
  filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6)) !important;
}

.menu-btn-img.back-btn-img {
  max-width: 204px; /* 340px 的 60% */
  margin-top: 30px;      /* 👈 往下推開 15px（可自由調整為 10px ~ 30px） */
}

.menu-btn-img:hover {
  transform: scale(1.03);
}

.menu-btn-img:active {
  transform: scale(0.94) translateY(3px); /* 點擊時的下壓物理反饋 */
}

    .menu-btn {
      width: 100%;
      padding: 16px 20px;
      font-size: 1.25rem;
      font-weight: bold;
      color: #ffffff;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(29,78,216,0.4);
      transition: transform 0.15s, filter 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .menu-btn .sub-text { font-size: 0.85rem; font-weight: normal; opacity: 0.85; margin-top: 3px; }
    .menu-btn:active { transform: scale(0.95); }

    .back-btn {
      background: transparent;
      color: #cbd5e1;
      border: 1px solid #64748b;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    /* ---------------- ⚔️ 畫面 3：遊戲挑戰區域 ---------------- */
    #screen-3-bg {
      transition: background-image 0.4s ease-in-out;
    }

    #game-info-bar {
      width: 100%;
      max-width: 520px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(8px);
      border-radius: 20px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 1.1rem;
      border: 3px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .info-center-lives {
      flex: 1;
      text-align: center;
      font-size: 1.6rem;
      letter-spacing: 2px;
    }

    /* ⏱️ 倒數計時器 UI 樣式 */
    #timer-container {
      width: 100%;
      max-width: 520px;
      margin-top: 10px;
      display: none; /* 僅無限模式顯示 */
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .timer-text {
      font-size: 1.2rem;
      font-weight: 900;
      color: #38bdf8;
      text-shadow: 0 0 8px rgba(56, 189, 248, 0.6);
      transition: color 0.3s;
    }
    .timer-text.warning {
      color: #ef4444;
      text-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      animation: pulseText 0.5s infinite alternate;
    }
    .timer-bar-outer {
      width: 100%;
      height: 14px;
      background: rgba(30, 41, 59, 0.8);
      border: 2px solid #475569;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
    }
    .timer-bar-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #3b82f6);
      border-radius: 8px;
      transition: width 0.1s linear, background 0.3s;
    }
    .timer-bar-inner.warning {
      background: linear-gradient(90deg, #f59e0b, #ef4444);
    }

    @keyframes pulseText {
      0% { transform: scale(1); }
      100% { transform: scale(1.1); }
    }

    #combo-display-area {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
    }
    .combo-badge {
      font-size: 1.35rem;
      font-weight: 900;
      color: #facc15;
      text-shadow: 0 0 12px rgba(250, 204, 21, 0.9), 0 2px 4px rgba(0,0,0,0.9);
      animation: comboPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes comboPop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .audio-play-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, #facc15, #eab308);
      border: 4px solid #ffffff;
      font-size: 2.5rem;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(234, 179, 8, 0.5);
      margin: 10px 0 5px 0;
      transition: transform 0.15s;
    }
    .audio-play-btn:active { transform: scale(0.88); }

    .options-grid {
      display: grid;
      gap: 12px;
      width: 100%;
      max-width: 480px;
      margin-bottom: 10px;
    }
    .grid-2 { grid-template-columns: repeat(2, 1fr); }
    .grid-3 { grid-template-columns: repeat(3, 1fr); }
    .grid-4 { grid-template-columns: repeat(2, 1fr); }
    .grid-6 { grid-template-columns: repeat(3, 1fr); }

    /* ✨ 注音卡片發光與點擊回饋特效 */
    .symbol-card {
      background: rgba(30, 41, 59, 0.9);
      border: 3px solid #475569;
      border-radius: 18px;
      font-size: 2.3rem;
      font-weight: bold;
      color: #ffffff;
      padding: 18px 0;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
      transition: all 0.3s ease-out;
    }

    /* ✨ 選對：金色/青色炫光 */
    .symbol-card.glowing {
      transform: scale(1.08);
      border-color: #facc15 !important;
      box-shadow: 0 0 30px #facc15, 0 0 15px #38bdf8 !important;
      background: rgba(51, 65, 85, 0.98) !important;
      z-index: 10;
    }

    /* 🚨 選錯：紅色警告發光 */
    .symbol-card.glowing-wrong {
      transform: scale(1.08);
      border-color: #ef4444 !important;
      box-shadow: 0 0 30px #ef4444, 0 0 15px #f87171 !important;
      background: rgba(127, 29, 29, 0.95) !important;
      z-index: 10;
    }

    .symbol-card.disabled { opacity: 0.25; pointer-events: none; border-color: #1e293b; filter: grayscale(100%); box-shadow: none; }

    /* ---------------- ⏳ 載入緩衝黑屏 Modal ---------------- */
    #loading-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000000;
      z-index: 999;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #loading-overlay.active { display: flex; }
    .loading-text {
      font-size: 1.8rem;
      font-weight: bold;
      color: #facc15;
      text-shadow: 0 0 10px rgba(250, 204, 21, 0.6);
      animation: loadingPulse 1s ease-in-out infinite alternate;
    }
    @keyframes loadingPulse {
      0% { transform: scale(0.92); opacity: 0.6; }
      100% { transform: scale(1.08); opacity: 1; }
    }

    /* ---------------- 📊 彈窗 Modal ---------------- */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      align-items: center; justify-content: center;
      z-index: 100;
      backdrop-filter: blur(5px);
    }
    .modal.active { display: flex; }
    .modal-content {
      background: #1e293b;
      border-radius: 24px;
      padding: 25px;
      width: 88%; max-width: 420px;
      text-align: center;
      border: 2px solid #475569;
      box-shadow: 0 15px 30px rgba(0,0,0,0.6);
    }

    /* 🏷️ 首頁右下角版本號 */
    .version-tag {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 0.9rem;
      font-weight: bold;
      color: rgba(255, 255, 255, 0.8); /* 半透明白色 */
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      pointer-events: none; /* 避免擋到點擊事件 */
    }
  </style>
</head>
<body onclick="initAudioOnFirstTouch()">

  <!-- ⏳ 載入緩衝黑屏 -->
  <div id="loading-overlay">
    <div class="loading-text">🎒 冒險準備中...</div>
  </div>

  <!-- 🏠 畫面 1：遊戲歡迎頁（首頁） -->
  <div id="screen-1" class="screen active">
    <div class="screen-1-container">
      <img src="./pics/title.png" alt="小小注音冒險家" class="title-img" onerror="this.style.display='none'">
      <div class="start-btn-container">
        <img src="./pics/start_button.png" alt="開始冒險" class="start-btn-img" onclick="handleStartBtnClick()">
      </div>

       <!-- 💡 新增這行：右下角版本號 -->
      <div class="version-tag">v 2.1.02</div>
    </div>
  </div>

<!-- 🎮 畫面 2：模式選擇畫面 -->
<div id="screen-2" class="screen" style="background-image: url('./pics/start_banner.png');">
  <div class="overlay"></div>
  <div class="content-layer">
    <div class="menu-card">
      
      <!-- 一般模式按鈕 -->
      <button class="img-menu-btn" onclick="playClickAndGo('screen-2-2')">
        <img src="./pics/normal_mode_button.png" alt="一般模式" class="menu-btn-img">
      </button>

      <!-- 無限模式按鈕 -->
      <button class="img-menu-btn" onclick="playClickAndStartEndless()">
        <img src="./pics/infinity_mode_button.png" alt="無限模式" class="menu-btn-img">
      </button>

      <!-- 冒險紀錄按鈕 -->
      <button class="img-menu-btn" onclick="playClickAndShowBoard()">
        <img src="./pics/record_button.png" alt="冒險紀錄" class="menu-btn-img">
      </button>

      <!-- 返回首頁 -->
      <button class="img-menu-btn" onclick="playClickAndGo('screen-1')">
        <img src="./pics/Backward_button.png" alt="返回首頁" class="menu-btn-img back-btn-img">
      </button>

    </div>
  </div>
</div>

  <!-- 🗺️ 畫面 2-2：難度選擇畫面 -->
  <div id="screen-2-2" class="screen" style="background-image: url('./pics/start_banner.png');">
    <div class="overlay"></div>
    <div class="content-layer">
      <div class="menu-card">

      <!-- 簡單模式按鈕 -->
      <button class="img-menu-btn" onclick="playClickAndStartNormal('easy')">
        <img src="./pics/Newbie_button.png" alt="簡單模式" class="menu-btn-img">
      </button>

      <!-- 進階模式按鈕 -->
      <button class="img-menu-btn" onclick="playClickAndStartNormal('normal')">
        <img src="./pics/Expert_button.png" alt="進階模式" class="menu-btn-img">
      </button>

      <!-- 困難模式按鈕 -->
      <button class="img-menu-btn" onclick="playClickAndStartNormal('hard')">
        <img src="./pics/Elite_button.png" alt="困難模式" class="menu-btn-img">
      </button>

      <!-- 返回上頁 -->
      <button class="img-menu-btn" onclick="playClickAndGo('screen-2')">
        <img src="./pics/Backward_button.png" alt="返回上頁" class="menu-btn-img back-btn-img">
      </button>


      </div>
    </div>
  </div>

  <!-- ⚔️ 畫面 3：遊戲挑戰畫面 -->
  <div id="screen-3" class="screen">
    <div class="overlay"></div>
    <div class="content-layer" style="justify-content: space-between;">
      <!-- 頂部資訊列 -->
      <div id="game-info-bar">
        <span id="info-progress">題目：1/20</span>
        <span id="info-lives" class="info-center-lives"></span>
        <span id="info-score" style="color: #38bdf8;">得分：0</span>

      <!-- ⏱️ 倒數計時條 UI -->

      <!-- 🔥 獨立 Combo 顯示區塊 -->

      <!-- 發音喇叭 -->
      <div style="display:flex; flex-direction:column; align-items:center;">
        <button class="audio-play-btn" onclick="replayAudio()">🔊</button>
        <p style="color: #e2e8f0; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">點擊重複聽發音</p>

      <!-- 注音選項卡片區 -->
      <div id="options-container" class="options-grid"></div>

  <!-- 📊 第一階段：本次結算 Modal -->
  <div id="modal-result" class="modal">
    <div class="modal-content">
      <h2 id="result-title">🎉 冒險完成 🎉</h2>
      <div id="result-stars" style="font-size: 2.2rem; margin: 15px 0;"></div>
      <p id="result-desc" style="font-size: 1.1rem; line-height: 1.6; color: #cbd5e1;"></p>
      <button class="menu-btn" style="margin-top: 20px;" onclick="playDing(); closeModal('modal-result'); showLeaderboard();">🏆 查看冒險紀錄</button>

  </div>

  <!-- 🏆 第二階段：冒險紀錄排行榜 Modal -->
  <div id="modal-leaderboard" class="modal">
    <div class="modal-content">
      <h2 style="font-size: 1.5rem; color: #facc15;">🏆 冒險紀錄殿堂 🏆</h2>
      <div style="text-align: left; margin: 15px 0; font-size: 0.95rem; line-height: 1.8;">
        <h4 style="color: #38bdf8; border-bottom: 1px solid #475569; padding-bottom: 4px; margin-bottom: 8px;">🎯 一般模式 (最高分 1000)</h4>
        <div id="list-normal" style="color: #cbd5e1; margin-bottom: 15px;"></div>

      </div>
      <button class="menu-btn" onclick="playDing(); closeModal('modal-leaderboard'); goToScreen('screen-2');">回選單</button>
    </div>
  </div>

  <!-- 引入 Base64 音效檔 -->
  <script src="sounds.js"></script>

  <script>
    const ZHUYIN_LIST = [
      'ㄅ','ㄆ','ㄇ','ㄈ','ㄉ','ㄊ','ㄋ','ㄌ','ㄍ','ㄎ','ㄏ',
      'ㄐ','ㄑ','ㄒ','ㄓ','ㄔ','ㄕ','ㄖ','ㄗ','ㄘ','ㄙ',
      'ㄚ','ㄛ','ㄜ','ㄝ','ㄞ','ㄟ','ㄠ','ㄡ','ㄢ','ㄣ','ㄤ','ㄥ','ㄦ',
      'ㄧ','ㄨ','ㄩ'
    ];

    let state = {
      mode: 'normal',
      diff: 'easy',
      score: 0,
      questionCount: 0,
      lives: 3,
      combo: 0,
      currentAnswer: '',
      attempts: 0,
      isLocking: false // 防止連續點擊鎖
    };




/* =========================================================
   📱 Android 返回鍵防護與攔截機制
   ========================================================= */

// 1. 關鍵：進網頁時主動推入歷史紀錄，創造一個「虛擬上一頁」
function initHistoryGuard() {
  history.pushState({ page: 'guard' }, '', location.href);
}
window.addEventListener('load', initHistoryGuard);

// 2. 當切換畫面 (goToScreen) 時，也重新補滿防護牆，確保每一頁都能攔截
// (建議在您的 goToScreen 函數結尾處加上 initHistoryGuard(); )

// 3. 監聽系統返回鍵
window.addEventListener('popstate', (event) => {
  const currentScreen = document.querySelector('.screen.active');
  const screenId = currentScreen ? currentScreen.id : '';

  if (screenId === 'screen-3') {
    // ⚔️ 在遊戲挑戰中 (screen-3)：跳出確認視窗
    if (confirm('遊戲正在進行中，確定要放棄並離開嗎？')) {
      goToScreen('screen-1');
      initHistoryGuard(); // 退回首頁後重新補滿防護
    } else {
      initHistoryGuard(); // 取消則重新鎖住
    }
  } else if (screenId === 'screen-2-2') {
    // ↩️ 在子頁面 (screen-2-2)：自動退回 screen-2
    goToScreen('screen-2');
    initHistoryGuard();
  } else if (screenId === 'screen-2') {
    // ↩️ 在選擇關卡頁 (screen-2)：自動退回首頁 screen-1
    goToScreen('screen-1');
    initHistoryGuard();
  } else {
    // 🚪 在首頁 (screen-1)：提示是否要徹底退
   
      history.back(); 
    
  }
});





    // ⏱️ 計時器控制變數
    let timerInterval = null;
    let timerMaxDuration = 5000; // 當前題目的總時間 (ms)
    let timerRemainingTime = 5000; // 剩餘時間 (ms)

    let bgmAudio = null;
    let isAudioInitialized = false;

    function initAudioOnFirstTouch() {
      if (!isAudioInitialized && typeof BGM !== 'undefined') {
        bgmAudio = new Audio(BGM);
        bgmAudio.loop = true;
        bgmAudio.volume = 0.4;
        bgmAudio.play().catch(e => console.log('BGM Autoplay blocked'));
        isAudioInitialized = true;
      }
    }

// 🚀 iOS 音訊授權解鎖（與您原本的 visibilitychange 完美搭配）
document.addEventListener('click', function unlockAudioOnce() {
  // 1. 解鎖 Web Audio API 狀態
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  if (AudioCtx) {
    const ctx = new AudioCtx();
    ctx.resume();
  }

  // 2. 標記 Audio 已初始化（這樣您的 visibilitychange 就能安心執行）
  if (typeof isAudioInitialized !== 'undefined') {
    isAudioInitialized = true;
  }

  // 3. 如果背景音樂已建立，試著觸發一次解鎖
  if (typeof bgmAudio !== 'undefined' && bgmAudio) {
    bgmAudio.play().then(() => {
      // 如果目前在 screen-3，解鎖後立刻維持靜音/暫停
      const currentScreen = document.querySelector('.screen.active');
      if (currentScreen && currentScreen.id === 'screen-3') {
        bgmAudio.pause();
      }
    }).catch(e => console.log('Audio unlock check:', e));
  }
}, { once: true });


// 🎧 監聽頁面可見性變化（切換頁面/縮小視窗時自動暫停與接續播放）
document.addEventListener('visibilitychange', () => {
  // 只有在 Audio 已初始化（玩家點擊過畫面）的前提下才執行
  if (!isAudioInitialized || !bgmAudio) return;

  if (document.hidden) {
    // 🚪 頁面被隱藏（切到桌面、切換分頁、手機螢幕鎖定）
    bgmAudio.pause();
  } else {
    // 🏠 頁面重新回到畫面上
    // 注意：如果玩家目前正處於「遊戲挑戰中(screen-3)」，依原本規則是不放 BGM 的
    const currentScreen = document.querySelector('.screen.active');
    if (currentScreen && currentScreen.id !== 'screen-3') {
      bgmAudio.play().catch(e => console.log('BGM resume blocked:', e));
    }
  }
});




    function playBgm() {
      if (bgmAudio) bgmAudio.play().catch(e => console.log(e));
    }

    function stopBgm() {
      if (bgmAudio) bgmAudio.pause();
    }

    

    function goToScreen(screenId) {
      stopTimer(); // 切換畫面時停止計時器
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');

      if (screenId === 'screen-3') {
        stopBgm();
      } else {
        playBgm();
      }
      initHistoryGuard();
    }

    function handleStartBtnClick() {
      playDing();
      goToScreen('screen-2');
    }

// 🎮 通用按鈕點擊與切換函數（含 180ms 視覺動畫延遲）
function playClickAndGo(screenId) {
  // 1. 播放音效
  playDing();

  // 2. 抓取當前被點擊的按鈕圖片元素 (event.currentTarget 會拿到綁定 onclick 的 <button>)
  const btn = event.currentTarget;
  const img = btn.querySelector('img') || btn;

  // 3. 強制加上下壓樣式
  img.classList.add('pressed');

  // 4. 延遲 180 毫秒：讓玩家肉眼完整看到按壓回饋，再執行畫面切換
  setTimeout(() => {
    // 移除下壓樣式（避免下次切換回來時按鈕還處於被按下的狀態）
    img.classList.remove('pressed');
    
    // 執行原有的跳轉邏輯
    goToScreen(screenId);
  }, 180);
}

    function playClickAndShowBoard() {
      playDing();
      showLeaderboard();
    }

    function playClickAndStartNormal(diff) {
      playDing();
      showLoadingAndStart(() => {
        state.mode = 'normal';
        state.diff = diff;
        state.score = 0;
        state.questionCount = 1;
        
        const screen3 = document.getElementById('screen-3');
        if (diff === 'easy') screen3.style.backgroundImage = "url('./pics/bg_prairie.png')";
        else if (diff === 'normal') screen3.style.backgroundImage = "url('./pics/bg_jungle.png')";
        else if (diff === 'hard') screen3.style.backgroundImage = "url('./pics/bg_wasteland.png')";

        document.getElementById('timer-container').style.display = 'none'; // 一般模式隱藏計時條
        goToScreen('screen-3');
        nextQuestion();
      });
    }

    function playClickAndStartEndless() {
      playDing();
      showLoadingAndStart(() => {
        state.mode = 'endless';
        state.score = 0;
        state.questionCount = 1;
        state.lives = 3;
        state.combo = 0;
        
        document.getElementById('screen-3').style.backgroundImage = "url('./pics/bg_endless.png')";
        document.getElementById('timer-container').style.display = 'flex'; // 無限模式顯示計時條
        goToScreen('screen-3');
        nextQuestion();
      });
    }

    function showLoadingAndStart(callback) {
      const loader = document.getElementById('loading-overlay');
      loader.classList.add('active');
      setTimeout(() => {
        callback();
        loader.classList.remove('active');
      }, 3000);
    }

    // ⏱️ 計時器邏輯（無限模式時間階梯修正）
function startTimer() {
  stopTimer();
  if (state.mode !== 'endless') return;

  const timerContainer = document.getElementById('timer-container');

  // 無限模式時間階梯判斷：1-50 題無時間限制
  if (state.questionCount <= 30) {
    if (timerContainer) timerContainer.style.display = 'none';
    return; // 不啟動計時器
  } else if (state.questionCount <= 50) {
    timerMaxDuration = 10000;   // 31-50 題：10 秒
  } else if (state.questionCount <= 70) {
    timerMaxDuration = 5000;   // 51-70 題：5 秒
  } else if (state.questionCount <= 90) {
    timerMaxDuration = 3000;   // 71-90 題：3 秒
  } else {
    timerMaxDuration = 2000;   // 91 題以上：2 秒
  }

  // 超過 50 題時顯示倒數計時 UI 並開始倒數
  if (timerContainer) timerContainer.style.display = 'flex';

  timerRemainingTime = timerMaxDuration;
  updateTimerUI();

  const step = 100; // 每 100ms 刷新一次 UI
  timerInterval = setInterval(() => {
    timerRemainingTime -= step;
    if (timerRemainingTime <= 0) {
      timerRemainingTime = 0;
      updateTimerUI();
      handleTimeout();
    } else {
      updateTimerUI();
    }
  }, step);
}

function stopTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
}

    function updateTimerUI() {
      const timerText = document.getElementById('timer-text');
      const timerBar = document.getElementById('timer-bar-inner');
      
      const secondsSec = (timerRemainingTime / 1000).toFixed(1);
      timerText.innerText = `⏳ ${secondsSec} 秒`;

      const pct = (timerRemainingTime / timerMaxDuration) * 100;
      timerBar.style.width = `${pct}%`;

      // 剩餘時間小於等於 1.5 秒或 30% 時觸發紅光警示
      if (timerRemainingTime <= 1500 || pct <= 30) {
        timerText.classList.add('warning');
        timerBar.classList.add('warning');
      } else {
        timerText.classList.remove('warning');
        timerBar.classList.remove('warning');
      }
    }

    // 超時懲罰邏輯
    function handleTimeout() {
      stopTimer();
      playSfx('wrong');
      
      state.lives--;
      state.combo = 0;
      updateUI();

      if (state.lives <= 0) {
        state.isLocking = true;
        setTimeout(() => endGame(), 650);
      } else {
        // 超時後直接進入下一題
        state.questionCount++;
        nextQuestion();
      }
    }

    function nextQuestion() {
      state.attempts = 0;
      state.isLocking = false; // 解除點擊鎖
      updateUI();

      state.currentAnswer = ZHUYIN_LIST[Math.floor(Math.random() * ZHUYIN_LIST.length)];

      let optionCount = 2;
      if (state.mode === 'normal') {
        optionCount = state.diff === 'easy' ? 2 : (state.diff === 'normal' ? 4 : 6);
      } else {
        if (state.questionCount <= 10) optionCount = 2;
        else if (state.questionCount <= 20) optionCount = 3;
        else if (state.questionCount <= 30) optionCount = 4;
        else optionCount = 6;
      }

      let options = [state.currentAnswer];
      while (options.length < optionCount) {
        let pick = ZHUYIN_LIST[Math.floor(Math.random() * ZHUYIN_LIST.length)];
        if (!options.includes(pick)) options.push(pick);
      }
      options.sort(() => Math.random() - 0.5);

      const container = document.getElementById('options-container');
      container.className = `options-grid grid-${optionCount}`;
      container.innerHTML = '';

      options.forEach(symbol => {
        const btn = document.createElement('div');
        btn.className = 'symbol-card';
        btn.innerText = symbol;
        btn.onclick = () => handleAnswer(symbol, btn);
        container.appendChild(btn);
      });

      setTimeout(() => speak(state.currentAnswer), 250);

      // 開始當前題目倒數
      startTimer();
    }

    function replayAudio() {
      speak(state.currentAnswer);
    }

    // ✨ 答題邏輯（正確金/青光，錯誤紅光）
    function handleAnswer(selectedSymbol, btnElem) {
      if (state.isLocking) return; // 鎖定狀態下防止重複點擊

      if (selectedSymbol === state.currentAnswer) {
        // ----------------- 🎯 答對情況 -----------------
        state.isLocking = true;
        stopTimer(); // 答對立即凍結倒數時間條
        btnElem.classList.add('glowing'); // 觸發金色/青色發光
        playSfx('correct');

        if (state.mode === 'normal') {
          let earned = Math.max(0, 50 - (state.attempts * 10));
          state.score += earned;

          setTimeout(() => {
            btnElem.classList.remove('glowing');
            if (state.questionCount >= 20) {
              endGame();
            } else {
              state.questionCount++;
              nextQuestion();
            }
          }, 650);

        } else {
          state.combo++;
          let addScore = (state.combo >= 3) ? (50 + (state.combo * 10)) : 50;
          state.score += addScore;
          state.questionCount++;

          setTimeout(() => {
            btnElem.classList.remove('glowing');
            nextQuestion();
          }, 650);
        }

      } else {
        // ----------------- ❌ 答錯情況 -----------------
        // 選錯時不暫停倒數計時，時間繼續流逝！
        btnElem.classList.add('glowing-wrong'); // 觸發紅色發光
        playSfx('wrong');

        // 紅光維持 350ms 後，移除紅光並變灰停用
        setTimeout(() => {
          btnElem.classList.remove('glowing-wrong');
          btnElem.classList.add('disabled');
        }, 350);

        if (state.mode === 'normal') {
          state.attempts++;
        } else {
          state.lives--;
          state.combo = 0;
          updateUI();
          if (state.lives <= 0) {
            state.isLocking = true;
            stopTimer(); // 扣光生命時才停止計時
            setTimeout(() => endGame(), 650);
          }
        }
      }
    }

    function updateUI() {
      document.getElementById('info-score').innerText = `得分：${state.score}`;
      
      const livesElem = document.getElementById('info-lives');
      const comboArea = document.getElementById('combo-display-area');

      if (state.mode === 'normal') {
        document.getElementById('info-progress').innerText = `題目：${state.questionCount}/20`;
        livesElem.innerText = '';
        comboArea.innerHTML = '';
      } else {
        document.getElementById('info-progress').innerText = `第 ${state.questionCount} 題`;
        livesElem.innerText = '❤️'.repeat(state.lives);

        if (state.combo >= 3) {
          comboArea.innerHTML = `<div class="combo-badge">🔥 Combo x${state.combo}！</div>`;
        } else {
          comboArea.innerHTML = '';
        }
      }
    }

    function endGame() {
      stopTimer(); // 結束遊戲時徹底停止計時器
      saveScore(state.mode, state.score);

      const title = document.getElementById('result-title');
      const stars = document.getElementById('result-stars');
      const desc = document.getElementById('result-desc');

      if (state.mode === 'normal') {
        title.innerText = '🎉 冒險完成 🎉';
        let starStr = '⭐️';
        if (state.score === 1000) starStr = '👑 ⭐️⭐️⭐️⭐️⭐️';
        else if (state.score >= 900) starStr = '⭐️⭐️⭐️';
        else if (state.score >= 700) starStr = '⭐️⭐️';

        stars.innerText = starStr;
        desc.innerText = `最終得分：${state.score} 分\n成功突破 20 題考驗！`;
      } else {
        title.innerText = '👍 冒險結束！';
        stars.innerText = '🏆';
        desc.innerText = `最終得分：${state.score} 分\n總共答對前進了 ${state.questionCount - 1} 題！`;
      }

      document.getElementById('modal-result').classList.add('active');
    }

    function saveScore(mode, score) {
      const key = `zhuyin_ranks_${mode}`;
      let ranks = JSON.parse(localStorage.getItem(key) || '[]');
      ranks.push({ score, date: new Date().toLocaleDateString() });
      ranks.sort((a, b) => b.score - a.score);
      ranks = ranks.slice(0, 5);
      localStorage.setItem(key, JSON.stringify(ranks));
    }

    function showLeaderboard() {
      const normalRanks = JSON.parse(localStorage.getItem('zhuyin_ranks_normal') || '[]');
      const endlessRanks = JSON.parse(localStorage.getItem('zhuyin_ranks_endless') || '[]');

      const renderList = (ranks) => ranks.length === 0 
        ? '<p style="color:#64748b">尚無冒險紀錄</p>' 
        : ranks.map((r, i) => `<div>第 ${i+1} 名：<b style="color:#facc15">${r.score}</b> 分 <span style="font-size:0.8rem; color:#64748b;">(${r.date})</span></div>`).join('');

      document.getElementById('list-normal').innerHTML = renderList(normalRanks);
      document.getElementById('list-endless').innerHTML = renderList(endlessRanks);
      document.getElementById('modal-leaderboard').classList.add('active');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('active');
    }

    function confirmQuit() {
      playDing();
      if (confirm('確定要放棄這次的冒險返回選單嗎？')) {
        goToScreen('screen-2');
      }
    }

    // 🚀 註冊 PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('PWA Service Worker 註冊成功！範疇：', reg.scope))
          .catch(err => console.log('PWA Service Worker 註冊失敗：', err));
      });
    }
  </script>
